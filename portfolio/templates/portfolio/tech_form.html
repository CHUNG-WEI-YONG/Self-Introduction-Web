{% extends 'base.html' %}

{% block title %}{{ action_title }} | Portfolio{% endblock %}

{% block content %}
    <section class="section-block">
        <div class="section-title-wrap">
            <h2 class="section-heading" style="color: var(--c-emerald);">
                <span class="status-dot dot-emerald"></span> {{ action_title }}
            </h2>
            <a class="btn-glow-more" href="{% url 'portfolio:tech_stack' %}">&larr; Back to Stack</a>
        </div>

        <div class="form-container-card">
            <form method="post" novalidate>
                {% csrf_token %}
                {% for field in form %}
                    <div class="form-group">
                        <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <span class="field-error-msg">{{ field.errors.0 }}</span>
                        {% endif %}
                    </div>
                {% endfor %}

                <div class="form-action-bar">
                    <button type="submit" class="btn-glow-more btn-submit">
                        Save Technology <span class="arrow">&rarr;</span>
                    </button>
                    <a class="btn-cancel" href="{% url 'portfolio:tech_stack' %}">Cancel</a>
                </div>
            </form>
        </div>
    </section>
{% endblock %}
